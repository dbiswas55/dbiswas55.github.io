<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#fdf2f8"/>

  <!-- Input features -->
  <rect x="16" y="64" width="54" height="56" rx="6" fill="#ffffff" stroke="#f9a8d4" stroke-width="1.2"/>
  <line x1="24" y1="78" x2="62" y2="78" stroke="#f472b6" stroke-width="2"/>
  <line x1="24" y1="88" x2="54" y2="88" stroke="#f9a8d4" stroke-width="2"/>
  <line x1="24" y1="98" x2="60" y2="98" stroke="#f472b6" stroke-width="2"/>
  <line x1="24" y1="108" x2="48" y2="108" stroke="#f9a8d4" stroke-width="2"/>
  <text x="43" y="134" text-anchor="middle" font-size="7.5" fill="#9d174d" font-family="sans-serif">features</text>

  <!-- Five classifiers -->
  <rect x="96" y="22" width="62" height="20" rx="10" fill="#fbcfe8" stroke="#ec4899" stroke-width="1"/>
  <text x="127" y="35" text-anchor="middle" font-size="8" font-weight="600" fill="#831843" font-family="sans-serif">Model 1</text>
  <rect x="96" y="50" width="62" height="20" rx="10" fill="#fbcfe8" stroke="#ec4899" stroke-width="1"/>
  <text x="127" y="63" text-anchor="middle" font-size="8" font-weight="600" fill="#831843" font-family="sans-serif">Model 2</text>
  <rect x="96" y="78" width="62" height="20" rx="10" fill="#fbcfe8" stroke="#ec4899" stroke-width="1"/>
  <text x="127" y="91" text-anchor="middle" font-size="8" font-weight="600" fill="#831843" font-family="sans-serif">Model 3</text>
  <rect x="96" y="106" width="62" height="20" rx="10" fill="#fbcfe8" stroke="#ec4899" stroke-width="1"/>
  <text x="127" y="119" text-anchor="middle" font-size="8" font-weight="600" fill="#831843" font-family="sans-serif">Model 4</text>
  <rect x="96" y="134" width="62" height="20" rx="10" fill="#fbcfe8" stroke="#ec4899" stroke-width="1"/>
  <text x="127" y="147" text-anchor="middle" font-size="8" font-weight="600" fill="#831843" font-family="sans-serif">Model 5</text>

  <line x1="70" y1="92" x2="96" y2="32" stroke="#f472b6" stroke-width="1"/>
  <line x1="70" y1="92" x2="96" y2="60" stroke="#f472b6" stroke-width="1"/>
  <line x1="70" y1="92" x2="96" y2="88" stroke="#f472b6" stroke-width="1"/>
  <line x1="70" y1="92" x2="96" y2="116" stroke="#f472b6" stroke-width="1"/>
  <line x1="70" y1="92" x2="96" y2="144" stroke="#f472b6" stroke-width="1"/>

  <!-- Voting -->
  <circle cx="200" cy="88" r="22" fill="#db2777" stroke="#be185d" stroke-width="1.5"/>
  <text x="200" y="91" text-anchor="middle" font-size="8.5" font-weight="700" fill="white" font-family="sans-serif">Vote</text>
  <line x1="158" y1="32" x2="182" y2="76" stroke="#ec4899" stroke-width="1"/>
  <line x1="158" y1="60" x2="179" y2="81" stroke="#ec4899" stroke-width="1"/>
  <line x1="158" y1="88" x2="178" y2="88" stroke="#ec4899" stroke-width="1"/>
  <line x1="158" y1="116" x2="179" y2="95" stroke="#ec4899" stroke-width="1"/>
  <line x1="158" y1="144" x2="182" y2="100" stroke="#ec4899" stroke-width="1"/>

  <!-- Output classes -->
  <rect x="236" y="66" width="54" height="18" rx="4" fill="#ffffff" stroke="#f9a8d4" stroke-width="1"/>
  <text x="263" y="78" text-anchor="middle" font-size="7.5" fill="#9d174d" font-family="sans-serif">Benign</text>
  <rect x="236" y="92" width="54" height="18" rx="4" fill="#ffffff" stroke="#f9a8d4" stroke-width="1"/>
  <text x="263" y="104" text-anchor="middle" font-size="7.5" fill="#9d174d" font-family="sans-serif">Malignant</text>
  <line x1="222" y1="88" x2="236" y2="75" stroke="#be185d" stroke-width="1.2"/>
  <line x1="222" y1="88" x2="236" y2="101" stroke="#be185d" stroke-width="1.2"/>

  <text x="150" y="186" text-anchor="middle" font-size="8.5" fill="#be185d" font-family="sans-serif">Ensemble Learning for Breast Cancer</text>
</svg>
