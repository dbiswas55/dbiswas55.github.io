<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#f5f3ff"/>

  <!-- Central hub box -->
  <rect x="108" y="76" width="84" height="48" rx="8" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="150" y="96" text-anchor="middle" font-size="8.5" font-weight="700" fill="white" font-family="sans-serif">Inference</text>
  <text x="150" y="108" text-anchor="middle" font-size="8.5" font-weight="700" fill="white" font-family="sans-serif">Request</text>
  <text x="150" y="119" text-anchor="middle" font-size="7" fill="#ddd6fe" font-family="sans-serif">unified API</text>

  <!-- Left backend pills -->
  <!-- Ollama -->
  <rect x="12" y="30" width="62" height="18" rx="9" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="43" y="43" text-anchor="middle" font-size="8.5" fill="#5b21b6" font-family="sans-serif" font-weight="600">Ollama</text>
  <!-- MLX-VLM -->
  <rect x="12" y="56" width="62" height="18" rx="9" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="43" y="69" text-anchor="middle" font-size="8.5" fill="#5b21b6" font-family="sans-serif" font-weight="600">MLX-VLM</text>
  <!-- vLLM -->
  <rect x="12" y="82" width="62" height="18" rx="9" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="43" y="95" text-anchor="middle" font-size="8.5" fill="#5b21b6" font-family="sans-serif" font-weight="600">vLLM</text>
  <!-- HuggingFace -->
  <rect x="12" y="108" width="62" height="18" rx="9" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="43" y="121" text-anchor="middle" font-size="7.5" fill="#5b21b6" font-family="sans-serif" font-weight="600">HuggingFace</text>

  <!-- Right cloud pills -->
  <!-- Gemini -->
  <rect x="226" y="30" width="62" height="18" rx="9" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="257" y="43" text-anchor="middle" font-size="8.5" fill="#6d28d9" font-family="sans-serif" font-weight="600">Gemini</text>
  <!-- OpenAI -->
  <rect x="226" y="56" width="62" height="18" rx="9" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="257" y="69" text-anchor="middle" font-size="8.5" fill="#6d28d9" font-family="sans-serif" font-weight="600">OpenAI</text>
  <!-- Anthropic -->
  <rect x="226" y="82" width="62" height="18" rx="9" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="257" y="95" text-anchor="middle" font-size="8.5" fill="#6d28d9" font-family="sans-serif" font-weight="600">Anthropic</text>

  <!-- Connector lines left → hub -->
  <line x1="74" y1="39" x2="108" y2="90" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="74" y1="65" x2="108" y2="95" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="74" y1="91" x2="108" y2="100" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="74" y1="117" x2="108" y2="107" stroke="#a78bfa" stroke-width="1.2"/>

  <!-- Connector lines hub → right -->
  <line x1="192" y1="90" x2="226" y2="39" stroke="#c4b5fd" stroke-width="1.2"/>
  <line x1="192" y1="95" x2="226" y2="65" stroke="#c4b5fd" stroke-width="1.2"/>
  <line x1="192" y1="100" x2="226" y2="91" stroke="#c4b5fd" stroke-width="1.2"/>

  <!-- Bottom: input modalities -->
  <rect x="60" y="152" width="52" height="18" rx="6" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="86" y="165" text-anchor="middle" font-size="8" fill="#4c1d95" font-family="sans-serif" font-weight="600">🖼 Image</text>
  <rect x="122" y="152" width="56" height="18" rx="6" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="150" y="165" text-anchor="middle" font-size="8" fill="#4c1d95" font-family="sans-serif" font-weight="600">💬 Text</text>
  <rect x="188" y="152" width="52" height="18" rx="6" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="214" y="165" text-anchor="middle" font-size="8" fill="#4c1d95" font-family="sans-serif" font-weight="600">⚙ Config</text>

  <!-- Line up to hub -->
  <line x1="86" y1="152" x2="130" y2="124" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="150" y1="152" x2="150" y2="124" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="214" y1="152" x2="170" y2="124" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Label -->
  <text x="150" y="190" text-anchor="middle" font-size="8.5" fill="#6d28d9" font-family="sans-serif">VLM Inference Framework</text>
</svg>
